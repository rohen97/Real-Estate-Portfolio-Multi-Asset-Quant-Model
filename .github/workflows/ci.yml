name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PUBLIC_DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: uv run python scripts/create_public_demo.py
      - run: uv run python scripts/export_langgraph_diagrams.py
      - run: uv run pytest -q
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

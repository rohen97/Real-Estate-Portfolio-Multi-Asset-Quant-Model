name: Deploy public dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build static synthetic dashboard
        run: npm run build
        env:
          VITE_STATIC_DEMO: ${{ vars.PUBLIC_API_URL && '0' || '1' }}
          VITE_PUBLIC_DEMO: '1'
          VITE_API_BASE: ${{ vars.PUBLIC_API_URL || '/api' }}
          VITE_BASE: '/Real-Estate-Portfolio-Multi-Asset-Quant-Model/'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
